<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pago exitoso</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #e0ffe5, #f5f7fa);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    animation: fadeIn 0.8s ease;
    max-width: 400px;
  }

  .check {
    font-size: 60px;
    margin-bottom: 20px;
    animation: pop 0.5s ease;
  }

  h1 {
    margin: 10px 0;
  }

  p {
    color: #6e6e73;
    font-size: 15px;
  }

  .btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #000, #333);
    color: white;
    text-decoration: none;
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pop {
    from { transform: scale(0.5); }
    to { transform: scale(1); }
  }

  #estado {
  margin-top: 20px;
  font-size: 14px;
  color: #6e6e73;
  animation: fadeIn 0.5s ease;
}

.descarga {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 25px;
  padding: 14px 24px;
  border-radius: 14px;
  background: linear-gradient(135deg, #00c853, #00e676);
  color: white;
  font-weight: 600;
  font-size: 16px;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 10px 25px rgba(0,200,83,0.3);
}

.descarga:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 15px 30px rgba(0,200,83,0.4);
}
</style>
</head>

<body>

<div class="container">
  <div class="check">✅</div>
  <h1>Pago realizado</h1>
  <p>Tu compra fue <b>exitosa</b>, en breve recibirás tu PDF por correo electronico
  </br>Puedes descargar tu PDF haciendo click en el boton de abajo</p>

  <div id="estado">Validando tu compra...</div>

  <a id="btn-descarga" class="btn descarga" href="#" style="display:none;">
    📥 Descargar PDF
  </a>

  <script>
    const params = new URLSearchParams(window.location.search);
   const payment_id = params.get("payment_id");

  if (!payment_id) {
    document.body.innerHTML = "<h2>Acceso inválido</h2>";
  }

    let intentos = 0;
    const maxIntentos = 5;

    function validarToken() {
      fetch(`https://jt-guergo-n8n.ejbcpe.easypanel.host/webhook/validar-token?payment_id=${payment_id}`)
        .then(res => res.json())
        .then(data => {

          if (data.valid) {
            const btn = document.getElementById("btn-descarga");
            const estado = document.getElementById("estado");

            estado.innerHTML = "✅ Acceso confirmado. Tu descarga está lista";
            btn.href = data.pdf;
            btn.style.display = "inline-flex";

            return;
          }

          // 🔁 Reintento
          if (intentos < maxIntentos) {
            intentos++;
            setTimeout(validarToken, 1500); // espera 1.5s
          } else {
            document.body.innerHTML = "<h2>Error validando tu compra</h2>";
          }

        })
        .catch(() => {
          document.body.innerHTML = "<h2>Error al validar acceso</h2>";
        });
    }

    // Iniciar validación
    validarToken();
  </script>

  
</div>

</body>
</html>
