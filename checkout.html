<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #e0e7ff, #f5f7fa);
    color: #1d1d1f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 500px;
    text-align: center;
  }

  .card {
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    animation: fadeUp 0.6s ease;
  }

  h1 {
    margin-bottom: 20px;
  }

  h2 {
    margin: 10px 0;
  }

  p {
    color: #6e6e73;
    font-size: 14px;
  }

  .price {
    font-size: 22px;
    margin: 20px 0;
    font-weight: bold;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2793f8, #26dae7);
    color: white;
    text-decoration: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  .btn-secondary {
    margin-top: 10px;
    background: transparent;
    color: #555;
    border: none;
    cursor: pointer;
  }

  .loader {
    margin: 20px 0;
    font-size: 14px;
    color: #888;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>Confirmar compra</h1>

    <div id="curso">
      <div class="loader">Cargando curso...</div>
    </div>

    <button class="btn" onclick="comprar()">Pagar ahora</button>
    <button class="btn-secondary" onclick="volver()">← Volver</button>
  </div>
</div>

<script>
// Obtener IDwwwwwwwwwwwwwwww
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// Cargar curso
fetch("https://opensheet.elk.sh/1f3F9WluUGNdjtKPtGdBA1uVFaW_j_6B1kvo3SpHZ0oc/Hoja1")
  .then(res => res.json())
  .then(data => {
    const curso = data.find(c => c.id == id);

    document.getElementById("curso").innerHTML = `
      <h2>${curso.Titulo}</h2>
      <p>${curso.Descripcion}</p>
      <div class="price">$25.000 COP</div>
    `;
  });

// Comprar
function comprar() {
  const btn = document.querySelector(".btn");
  btn.innerText = "Redirigiendo...";
  btn.disabled = true;

  fetch("https://jt-guergo-n8n.ejbcpe.easypanel.host/webhook/crear-pago?id=" + id)
    .then(res => res.json())
    .then(data => {
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Error con el pago");
        btn.innerText = "Pagar ahora";
        btn.disabled = false;wwww
      }
    })
    .catch(() => {
      alert("Error conectando con n8n");
      btn.innerText = "Pagar ahora";
      btn.disabled = false;
    });
}

// Volver
function volver() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
