<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pago fallido</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #ffe0e0, #f5f7fa);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    animation: fadeIn 0.8s ease;
    max-width: 420px;
  }

  .icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: shake 0.5s ease;
  }

  h1 {
    margin: 10px 0;
    color: #d93025;
  }

  p {
    color: #6e6e73;
    font-size: 15px;
    line-height: 1.5;
  }

  .btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #000, #333);
    color: white;
    text-decoration: none;
    transition: 0.3s;
    font-size: 14px;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .btn.secondary {
    background: #e0e0e0;
    color: #333;
    margin-left: 10px;
  }

  .btn.secondary:hover {
    background: #d5d5d5;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
  }
</style>
</head>

<body>

<div class="container">
  <div class="icon">❌</div>

  <h1>Pago no completado</h1>

  <p>
    Tu pago no pudo procesarse correctamente.<br><br>
    Esto puede deberse a fondos insuficientes, error en el método de pago
    o cancelación del proceso.
  </p>

  <p>
    Puedes intentarlo nuevamente o elegir otro método de pago.
  </p>

  <a id="btn-retry" href="#" class="btn">
    Intentar nuevamente
  </a>

  <a href="#" onclick="goBack()" class="btn secondary">
  Volver
  </a>
</div>



<script>

  const params = new URLSearchParams(window.location.search);

  const producto_id = params.get("external_reference");

  const btnRetry = document.getElementById("btn-retry");

  if (producto_id) {
    btnRetry.href = `checkout.html?id=${producto_id}`;
  } else {
    btnRetry.href = "index.html";
  }

  function goBack() {
    if (document.referrer) {
      history.back();
    } else {
      window.location.href = "https://cursos-pdf-brown.vercel.app/index.html";
    }
  }
</script>

</body>
</html>
