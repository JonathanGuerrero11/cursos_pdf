<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cursos</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #e0e7ff, #f5f7fa);
    color: #1d1d1f;
    overflow-x: hidden;
  }

  /* Glow fondo */
  body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(100, 150, 255, 0.15);
    filter: blur(120px);
    top: -100px;
    left: -100px;
    z-index: -1;
  }

  header {
    text-align: center;
    padding: 60px 20px 30px;
    animation: fadeDown 0.8s ease;
  }

  h1 {
    font-size: 42px;
    margin-bottom: 20px;
  }

  #buscador {
    padding: 14px;
    width: 60%;
    max-width: 500px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    outline: none;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: 0.3s;
  }

  #buscador:focus {
    transform: scale(1.05);
  }

  #cursos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    padding: 40px;
    max-width: 1100px;
    margin: auto;
  }

  .card {
    background: rgba(255,255,255,0.75);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: all 0.4s ease;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    height: 260px; /* 🔥 tamaño uniforme */
  }

    .card p {
    color: #6e6e73;
    font-size: 14px;

    display: -webkit-box;
    -webkit-line-clamp: 4; /* 🔥 máximo 3 líneas */
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card h3 {
  margin: 10px 0;
  font-size: 18px;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

  .card.show {
    opacity: 1;
    transform: translateY(0);
  }

  .card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
  }

  .badge {
    display: inline-block;
    background: #00a82a;
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .card h3 {
    margin: 10px 0;
  }

  .card p {
    color: #6e6e73;
    font-size: 14px;
  }

  .btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2793f8, #26dae7);
    color: white;
    text-decoration: none;
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    #buscador { width: 90%; }
  }
</style>
</head>

<body>

<header>
  <h1>Explora Cursos</h1>
  <input type="text" id="buscador" placeholder="Buscar..." onkeyup="filtrarCursos()">
</header>

<div id="cursos"></div>

<script>
fetch("https://opensheet.elk.sh/1f3F9WluUGNdjtKPtGdBA1uVFaW_j_6B1kvo3SpHZ0oc/Hoja1")
  .then(res => res.json())
  .then(data => {
    const contenedor = document.getElementById("cursos");

    data.reverse().forEach((curso, index) => {
      const div = document.createElement("div");

      div.innerHTML = `
        <div class="card">
          ${index < 2 ? '<span class="badge">Nuevo</span>' : ''}
          <h3>${curso.Titulo}</h3>
          <p>${curso.Descripcion}</p>
          <a href="checkout.html?id=${curso.id}" class="btn">Comprar</a>
        </div>
      `;

      contenedor.appendChild(div);

      setTimeout(() => {
        div.querySelector(".card").classList.add("show");
      }, index * 100);
    });
  });

function filtrarCursos() {
  const input = document.getElementById("buscador").value.toLowerCase();
  const cursos = document.querySelectorAll("#cursos > div");

  cursos.forEach(cursoDiv => {
    const titulo = cursoDiv.querySelector("h3").innerText.toLowerCase();

    if (titulo.includes(input)) {
      cursoDiv.style.display = "block";
    } else {
      cursoDiv.style.display = "none";
    }
  });
}
</script>

</body>
</html>
